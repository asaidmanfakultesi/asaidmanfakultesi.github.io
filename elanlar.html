
<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elanlar</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 36px;
      background: #f3f7ff;
      color: #0750b8;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 40px;
      margin: 0 0 24px;
    }

    .intro {
      font-size: 20px;
      margin-bottom: 22px;
    }

    .elan {
      background: white;
      border: 1px solid #cfe0ff;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 16px;
    }

    .elan h2 {
      font-size: 21px;
      margin: 0 0 12px;
    }

    .elan p {
      color: #334155;
      font-size: 18px;
      line-height: 1.6;
      margin: 0;
    }

    .date {
      color: #64748b;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .back {
      display: inline-block;
      margin-top: 12px;
      color: #0750b8;
      font-size: 19px;
    }

    @media (max-width: 600px) {
      body { padding: 22px; }
      h1 { font-size: 32px; }
      .elan h2 { font-size: 19px; }
      .elan p { font-size: 16px; }
    }
  </style>
</head>

<body>
  <main class="container">

    <h1>Elanlar</h1>
    <p class="intro">
      Fakültənin elanları və vacib məlumatları
    </p>

    <!-- YENİ ELANLARI BURAYA ƏLAVƏ EDİN -->

    <article class="elan">
      <div class="date">Tarix: __.__.____</div>
      <h2>Elanın başlığı</h2>
      <p>
        Elanın mətni burada yerləşdiriləcək.
      </p>
    </article>

    <!-- NÖVBƏTİ ELAN ÜÇÜN NÜMUNƏ -->

    <article class="elan">
      <div class="date">Tarix: __.__.____</div>
      <h2>İkinci elanın başlığı</h2>
      <p>
        İkinci elanın mətni burada yerləşdiriləcək.
      </p>
    </article>

    <a class="back" href="index.html">
      ← Ana səhifəyə qayıt
    </a>

  </main>
</body>
</html>
